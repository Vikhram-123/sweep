name: app_infonce_seed2
model: pairwise
loss: infonce
notes: Model A trained with InfoNCE (in-batch same-category negatives, learned temperature)
seed: 2
device: cpu
encoder: fashionclip
hidden: 256
out_dim: 128
dropout: 0.1
normalize: true
temperature_init: 0.07
learn_temperature: true
margin: 0.2
lr: 0.001
weight_decay: 0.0001
batch_size: 512
max_epochs: 50
patience: 5
