name: model_a_neg_knn_seed1
model: pairwise
notes: Model A, negatives from the positive's 50 nearest same-type neighbours (cos
  <= 0.95)
seed: 1
device: cpu
hidden: 256
out_dim: 128
dropout: 0.1
normalize: true
margin: 0.2
lr: 0.001
weight_decay: 0.0001
batch_size: 512
max_epochs: 50
patience: 5
negatives: knn
knn_frac: 1.0
