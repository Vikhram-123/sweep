# Outfit-level (FITB-style) training: context = outfit minus one item, candidates = target + n_neg same-type items.
name: listwise
model: outfit
projection_model: pairwise   # pairwise (Model A) | type_aware (Model B) | csa (Model C, CSA-Net subspaces)
loss: listwise               # listwise (softmax over candidates) | outfit_rank (CSA-Net hinge, semi-hard)
pool: mean                   # mean (CSA eq. 5) | attention (type-aware attention over context items)
infonce_weight: 0.0          # > 0 adds lambda * InfoNCE on item pairs each step
notes: Model A trained with a listwise FITB-style loss (16 candidates, mean pooling)
seed: 0
device: cpu
encoder: fashionclip

hidden: 256
out_dim: 128
dropout: 0.1
normalize: true
n_neg: 15
attn_dim: 32
n_subspaces: 5

temperature_init: 0.07
margin: 0.2                  # outfit_rank only
lr: 0.001
weight_decay: 0.0001
batch_size: 256              # held-out targets per step
pair_batch_size: 512         # InfoNCE pairs per step (when infonce_weight > 0)

max_epochs: 50
patience: 5
