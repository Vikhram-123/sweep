# Model B: Model A + a learned diagonal projection (mask) per unordered type pair (Vasileva et al. 2018).
name: model_b
model: type_aware       # pairwise (A) | type_aware (B)
projection: diagonal     # diagonal (128 params per type pair) | full (128x128 per pair)
notes: Model A + learned diagonal mask per type pair (66 pairs), masks init to 1
seed: 0
device: cpu              # the MLP is tiny; per-step MPS launch overhead outweighs the speedup

hidden: 256
out_dim: 128
dropout: 0.1
normalize: true          # L2-normalise outputs, so distances live in [0, 2] and the margin has a fixed scale

margin: 0.2
lr: 0.001
weight_decay: 0.0001
batch_size: 512

max_epochs: 50
patience: 5              # stop after this many epochs without a better validation AUC
