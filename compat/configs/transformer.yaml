# Outfit transformer v1: set of item tokens (frozen embedding projection + type embedding) -> [CLS] -> logit.
name: transformer
model: transformer
notes: 2-layer 4-head set transformer over items + type embeddings, BCE on real vs swapped outfits
seed: 0
device: cpu
encoder: fashionclip
features: image

d_model: 128
heads: 4
layers: 2
ff: 256
dropout: 0.1
single_swap_frac: 0.5    # fakes: half swap one item (FITB-like), half swap every item (like test negatives)

lr: 0.0003
weight_decay: 0.0001
batch_size: 128

max_epochs: 60
patience: 8
