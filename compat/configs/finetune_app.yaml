# App track: the best image encoder from Phase 2, last few transformer blocks unfrozen.
name: ft_app
notes: fashion ViT encoder, last 4 blocks + head fine-tuned, InfoNCE, 128-d
encoder: zooclaw_fashionsiglip2  # Phase 2 winner (val 0.952, 3 seeds); options (fashionclip | marqo_fashionsiglip | zooclaw_fashionsiglip2)
unfreeze_blocks: 4            # of 12; the rest stay frozen (keeps the pretrained knowledge, cuts memory)
seed: 0
device: auto
amp: true
grad_checkpointing: true      # trades ~30% speed for much less activation memory on a T4

hidden: 256
out_dim: 128
dropout: 0.1
temperature_init: 0.08        # what frozen FashionCLIP + InfoNCE converged to (Phase 1)

batch_size: 256               # pairs per step (512 images); --find-batch to check the GPU you got
eval_batch_size: 256
pairs_per_epoch: 131072
max_epochs: 15
patience: 3

lr_encoder: 0.00001           # 100x smaller than the head: nudge, don't overwrite, the pretrained ViT
lr_head: 0.001
weight_decay_encoder: 0.05    # standard for ViT fine-tuning
weight_decay_head: 0.0001
freeze_epochs: 1
warmup_epochs_encoder: 1
warmup_epochs_head: 0.1

log_every: 50
ckpt_every: 200
smoke_batch_size: 4
smoke_steps: 3
